<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Microsoft YaHei, SimHei, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- 系统边界 -->
  <rect x="250" y="20" width="830" height="780" rx="12" fill="#f0f4ff" stroke="#409EFF" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="665" y="50" font-size="16" font-weight="bold" fill="#409EFF" text-anchor="middle">SEU 智能选课系统</text>

  <!-- ====== Actors ====== -->
  <!-- 学生 -->
  <line x1="80" y1="140" x2="80" y2="195" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="120" r="12" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="155" x2="100" y2="155" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="155" x2="60" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="155" x2="100" y2="180" stroke="#333" stroke-width="2"/>
  <text x="80" y="215" font-size="13" font-weight="bold" text-anchor="middle">学生</text>
  <text x="80" y="232" font-size="10" fill="#666" text-anchor="middle">Student</text>

  <!-- 教师 -->
  <line x1="80" y1="340" x2="80" y2="395" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="320" r="12" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="355" x2="100" y2="355" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="355" x2="60" y2="380" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="355" x2="100" y2="380" stroke="#333" stroke-width="2"/>
  <text x="80" y="415" font-size="13" font-weight="bold" text-anchor="middle">教师</text>
  <text x="80" y="432" font-size="10" fill="#666" text-anchor="middle">Teacher</text>

  <!-- 管理员 -->
  <line x1="80" y1="560" x2="80" y2="615" stroke="#333" stroke-width="2"/>
  <circle cx="80" cy="540" r="12" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="575" x2="100" y2="575" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="575" x2="60" y2="600" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="575" x2="100" y2="600" stroke="#333" stroke-width="2"/>
  <text x="80" y="635" font-size="13" font-weight="bold" text-anchor="middle">教务管理员</text>
  <text x="80" y="652" font-size="10" fill="#666" text-anchor="middle">Admin</text>

  <!-- ====== Use Cases (椭圆) ====== -->
  <!-- 学生用例 (column 1) -->
  <ellipse cx="460" cy="100" rx="70" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="104" font-size="11" text-anchor="middle">UC01 登录系统</text>

  <ellipse cx="460" cy="150" rx="70" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="154" font-size="11" text-anchor="middle">UC02 退出登录</text>

  <ellipse cx="460" cy="200" rx="80" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="204" font-size="11" text-anchor="middle">UC03 查看仪表盘</text>

  <ellipse cx="460" cy="250" rx="80" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="254" font-size="11" text-anchor="middle">UC04 管理个人信息</text>

  <ellipse cx="460" cy="300" rx="80" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="304" font-size="11" text-anchor="middle">UC05 浏览可选课程</text>

  <ellipse cx="460" cy="350" rx="70" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="2"/>
  <text x="460" y="354" font-size="11" font-weight="bold" text-anchor="middle">UC06 选课（抢课）</text>

  <ellipse cx="460" cy="400" rx="70" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="404" font-size="11" text-anchor="middle">UC07 退选课程</text>

  <ellipse cx="460" cy="450" rx="80" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="454" font-size="11" text-anchor="middle">UC08 全校课程查询</text>

  <ellipse cx="460" cy="500" rx="80" ry="22" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="460" y="504" font-size="11" text-anchor="middle">UC09 查看个人课表</text>

  <!-- 教师用例 (column 2) -->
  <ellipse cx="700" cy="300" rx="80" ry="22" fill="#fdf6ec" stroke="#E6A23C" stroke-width="2"/>
  <text x="700" y="304" font-size="11" font-weight="bold" text-anchor="middle">UC10 申报课程</text>

  <ellipse cx="700" cy="350" rx="80" ry="22" fill="#fdf6ec" stroke="#E6A23C" stroke-width="1.5"/>
  <text x="700" y="354" font-size="11" text-anchor="middle">UC11 查看申报记录</text>

  <!-- 管理员用例 (column 3) -->
  <ellipse cx="940" cy="300" rx="80" ry="22" fill="#fef0f0" stroke="#F56C6C" stroke-width="2"/>
  <text x="940" y="304" font-size="11" font-weight="bold" text-anchor="middle">UC12 审核课程</text>

  <ellipse cx="940" cy="350" rx="80" ry="22" fill="#fef0f0" stroke="#F56C6C" stroke-width="2"/>
  <text x="940" y="354" font-size="11" font-weight="bold" text-anchor="middle">UC13 智能排课</text>

  <ellipse cx="940" cy="400" rx="80" ry="22" fill="#fef0f0" stroke="#F56C6C" stroke-width="1.5"/>
  <text x="940" y="404" font-size="11" text-anchor="middle">UC14 系统重置</text>

  <ellipse cx="940" cy="450" rx="80" ry="22" fill="#fef0f0" stroke="#F56C6C" stroke-width="1.5"/>
  <text x="940" y="454" font-size="11" text-anchor="middle">UC15 管理教室资源</text>

  <ellipse cx="940" cy="500" rx="80" ry="22" fill="#fef0f0" stroke="#F56C6C" stroke-width="1.5"/>
  <text x="940" y="504" font-size="11" text-anchor="middle">UC16 查看教室课表</text>

  <!-- ====== Lines (参与者到用例) ====== -->
  <!-- 学生 to UC01-09 -->
  <line x1="152" y1="135" x2="390" y2="100" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="140" x2="390" y2="150" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="145" x2="380" y2="200" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="148" x2="380" y2="250" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="150" x2="380" y2="300" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="152" x2="390" y2="350" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="153" x2="390" y2="400" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="155" x2="380" y2="450" stroke="#333" stroke-width="1.2"/>
  <line x1="152" y1="157" x2="380" y2="500" stroke="#333" stroke-width="1.2"/>

  <!-- 教师 to UC01-04, UC10-11 (shared UC01-04) -->
  <line x1="152" y1="335" x2="390" y2="100" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="152" y1="338" x2="390" y2="200" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="152" y1="340" x2="380" y2="250" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="152" y1="345" x2="620" y2="300" stroke="#E6A23C" stroke-width="1.5"/>
  <line x1="152" y1="348" x2="620" y2="350" stroke="#E6A23C" stroke-width="1.2"/>

  <!-- 管理员 to UC01-04, UC12-16 (shared UC01-04) -->
  <line x1="152" y1="555" x2="390" y2="100" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="152" y1="558" x2="390" y2="200" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="152" y1="560" x2="380" y2="250" stroke="#333" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="152" y1="565" x2="860" y2="300" stroke="#F56C6C" stroke-width="1.5"/>
  <line x1="152" y1="568" x2="860" y2="350" stroke="#F56C6C" stroke-width="1.5"/>
  <line x1="152" y1="570" x2="860" y2="400" stroke="#F56C6C" stroke-width="1.2"/>
  <line x1="152" y1="573" x2="860" y2="450" stroke="#F56C6C" stroke-width="1.2"/>
  <line x1="152" y1="575" x2="860" y2="500" stroke="#F56C6C" stroke-width="1.2"/>

  <!-- ====== 关系标注 ====== -->
  <!-- Include: UC06 includes UC01 -->
  <line x1="450" y1="372" x2="450" y2="128" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead-dashed)"/>
  <text x="435" y="250" font-size="9" fill="#666" transform="rotate(-90 435 250)">«include»</text>

  <!-- Extend: UC07 extends UC06 -->
  <line x1="470" y1="372" x2="470" y2="400" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead-dashed)"/>
  <text x="478" y="390" font-size="9" fill="#666">«extend»</text>

  <!-- Include: UC10 includes UC01 -->
  <line x1="680" y1="322" x2="500" y2="115" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="560" y="210" font-size="9" fill="#666">«include»</text>

  <!-- Include: UC12 includes UC01 -->
  <line x1="920" y1="322" x2="500" y2="115" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="660" y="200" font-size="9" fill="#666">«include»</text>

  <!-- Precedes 标注 -->
  <!-- UC10 → UC12 -->
  <line x1="780" y1="300" x2="860" y2="300" stroke="#999" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="805" y="293" font-size="9" fill="#999">«precedes»</text>

  <!-- UC12 → UC13 -->
  <line x1="940" y1="322" x2="940" y2="328" stroke="#999" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="950" y="335" font-size="9" fill="#999">«precedes»</text>

  <!-- UC06 → UC09 -->
  <line x1="460" y1="372" x2="460" y2="478" stroke="#999" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="468" y="430" font-size="9" fill="#999">«precedes»</text>

  <!-- ====== 图例 ====== -->
  <rect x="280" y="620" width="600" height="95" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="300" y="640" font-size="11" font-weight="bold">图例</text>
  <line x1="300" y1="660" x2="360" y2="660" stroke="#333" stroke-width="1.2"/>
  <text x="368" y="664" font-size="10">参与者关联</text>
  <line x1="460" y1="660" x2="520" y2="660" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="528" y="664" font-size="10">«include» / «extend»</text>
  <line x1="680" y1="660" x2="740" y2="660" stroke="#999" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="748" y="664" font-size="10">«precedes» 前置依赖</text>

  <ellipse cx="320" cy="688" rx="30" ry="10" fill="#ecf5ff" stroke="#409EFF" stroke-width="1"/>
  <text x="320" y="692" font-size="8" text-anchor="middle">学生用例</text>
  <ellipse cx="420" cy="688" rx="30" ry="10" fill="#fdf6ec" stroke="#E6A23C" stroke-width="1"/>
  <text x="420" y="692" font-size="8" text-anchor="middle">教师用例</text>
  <ellipse cx="520" cy="688" rx="30" ry="10" fill="#fef0f0" stroke="#F56C6C" stroke-width="1"/>
  <text x="520" y="692" font-size="8" text-anchor="middle">管理用例</text>
</svg>
