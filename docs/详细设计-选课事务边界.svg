<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .title { font-size: 28px; font-weight: 700; }
      .lane-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; }
      .front { fill: #eff6ff; stroke: #2563eb; }
      .service { fill: #f0fdf4; stroke: #16a34a; }
      .redis { fill: #fff7ed; stroke: #ea580c; }
      .db { fill: #fdf2f8; stroke: #db2777; }
      .event { fill: #f5f3ff; stroke: #7c3aed; }
      .fail { fill: #fef2f2; stroke: #dc2626; }
      .line { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
      .small { font-size: 14px; }
      .label { font-size: 15px; font-weight: 600; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">选课方法级事务边界与失败停止点</text>
  <text x="600" y="72" text-anchor="middle" class="small">CourseServiceImpl.selectCourse：先完成强一致状态，再发布事件</text>

  <rect x="45" y="105" width="210" height="585" fill="#e0f2fe" opacity="0.35" stroke="#93c5fd"/>
  <rect x="270" y="105" width="255" height="585" fill="#dcfce7" opacity="0.35" stroke="#86efac"/>
  <rect x="540" y="105" width="215" height="585" fill="#ffedd5" opacity="0.35" stroke="#fdba74"/>
  <rect x="770" y="105" width="205" height="585" fill="#fce7f3" opacity="0.35" stroke="#f9a8d4"/>
  <rect x="990" y="105" width="165" height="585" fill="#ede9fe" opacity="0.35" stroke="#c4b5fd"/>

  <text x="150" y="132" text-anchor="middle" class="lane-title">前端</text>
  <text x="398" y="132" text-anchor="middle" class="lane-title">CourseServiceImpl</text>
  <text x="648" y="132" text-anchor="middle" class="lane-title">Redis</text>
  <text x="872" y="132" text-anchor="middle" class="lane-title">MySQL</text>
  <text x="1072" y="132" text-anchor="middle" class="lane-title">事件</text>

  <rect x="70" y="170" width="160" height="54" class="box front"/>
  <text x="150" y="193" text-anchor="middle" class="label">点击抢课</text>
  <text x="150" y="212" text-anchor="middle" class="small">POST /course/select</text>

  <rect x="305" y="160" width="185" height="48" class="box service"/>
  <text x="398" y="189" text-anchor="middle" class="label">校验课程 status=2</text>

  <rect x="305" y="235" width="185" height="58" class="box service"/>
  <text x="398" y="258" text-anchor="middle" class="label">检测时间冲突</text>
  <text x="398" y="277" text-anchor="middle" class="small">目标课程 vs 已选课程</text>

  <rect x="565" y="230" width="165" height="58" class="box redis"/>
  <text x="648" y="253" text-anchor="middle" class="label">幂等集合检查</text>
  <text x="648" y="272" text-anchor="middle" class="small">course:users:{id}</text>

  <rect x="565" y="325" width="165" height="58" class="box redis"/>
  <text x="648" y="348" text-anchor="middle" class="label">库存预扣</text>
  <text x="648" y="367" text-anchor="middle" class="small">decrement(stockKey)</text>

  <rect x="795" y="320" width="155" height="58" class="box db"/>
  <text x="872" y="343" text-anchor="middle" class="label">DB 防重复</text>
  <text x="872" y="362" text-anchor="middle" class="small">student_course</text>

  <rect x="795" y="415" width="155" height="70" class="box db"/>
  <text x="872" y="438" text-anchor="middle" class="label">落库与计数</text>
  <text x="872" y="457" text-anchor="middle" class="small">insert selection</text>
  <text x="872" y="476" text-anchor="middle" class="small">selected_count + 1</text>

  <rect x="565" y="510" width="165" height="58" class="box redis"/>
  <text x="648" y="533" text-anchor="middle" class="label">记录已选集合</text>
  <text x="648" y="552" text-anchor="middle" class="small">SADD studentId</text>

  <rect x="1008" y="510" width="128" height="58" class="box event"/>
  <text x="1072" y="533" text-anchor="middle" class="label">发布事件</text>
  <text x="1072" y="552" text-anchor="middle" class="small">CourseSelected</text>

  <rect x="305" y="610" width="185" height="52" class="box fail"/>
  <text x="398" y="632" text-anchor="middle" class="label">异常分支</text>
  <text x="398" y="651" text-anchor="middle" class="small">补偿库存，不发事件</text>

  <path d="M230 197 L305 184" class="line"/>
  <path d="M398 208 L398 235" class="line"/>
  <path d="M490 264 L565 259" class="line"/>
  <path d="M648 288 L648 325" class="line"/>
  <path d="M730 354 L795 349" class="line"/>
  <path d="M872 378 L872 415" class="line"/>
  <path d="M795 450 L730 539" class="line"/>
  <path d="M730 539 L1008 539" class="line"/>
  <path d="M565 355 C510 400, 500 560, 490 636" class="line dash"/>
  <text x="520" y="450" class="small" fill="#b91c1c">库存或 DB 失败</text>
  <path d="M490 636 C535 620, 585 595, 625 568" class="line dash"/>
  <text x="570" y="618" class="small" fill="#b91c1c">increment(stockKey)</text>
</svg>
