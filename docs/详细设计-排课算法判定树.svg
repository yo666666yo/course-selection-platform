<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", Arial, sans-serif; fill:#111827; }
      .title { font-size: 28px; font-weight: 700; }
      .small { font-size: 13px; fill:#475569; }
      .box { fill:#fff; stroke:#334155; stroke-width:1.3; rx:10; }
      .start { fill:#ecfeff; stroke:#0891b2; }
      .decision { fill:#fffbeb; stroke:#d97706; }
      .action { fill:#f0fdf4; stroke:#16a34a; }
      .fail { fill:#fef2f2; stroke:#dc2626; }
      .write { fill:#fdf2f8; stroke:#db2777; }
      .label { font-size: 16px; font-weight:700; }
      .line { stroke:#374151; stroke-width:1.3; fill:none; marker-end:url(#arrow3); }
      .tag { font-size:12px; font-weight:700; fill:#1f2937; }
    </style>
  </defs>
  <rect width="1200" height="780" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">AutoScheduleService 排课算法判定树</text>
  <text x="600" y="70" text-anchor="middle" class="small">从待排课课程到 course_schedule、status=2 和 Redis 库存初始化</text>

  <rect x="485" y="105" width="230" height="54" class="box start"/>
  <text x="600" y="137" text-anchor="middle" class="label">读取 status=1 课程</text>

  <rect x="485" y="190" width="230" height="64" class="box action"/>
  <text x="600" y="214" text-anchor="middle" class="label">初始化内存约束表</text>
  <text x="600" y="235" text-anchor="middle" class="small">majorBusyMap / majorPeTimeMap</text>

  <rect x="485" y="285" width="230" height="58" class="box action"/>
  <text x="600" y="309" text-anchor="middle" class="label">课程类型排序</text>
  <text x="600" y="330" text-anchor="middle" class="small">体育课 > 专业课 > 通选课</text>

  <rect x="485" y="375" width="230" height="58" class="box decision"/>
  <text x="600" y="399" text-anchor="middle" class="label">是否有偏好时间?</text>
  <text x="600" y="420" text-anchor="middle" class="small">timePreferences 或 PE lock</text>

  <rect x="165" y="470" width="255" height="72" class="box decision"/>
  <text x="292" y="495" text-anchor="middle" class="label">尝试偏好时间</text>
  <text x="292" y="516" text-anchor="middle" class="small">容量 / 地点 / 教室 / 专业冲突</text>

  <rect x="780" y="470" width="255" height="72" class="box decision"/>
  <text x="907" y="495" text-anchor="middle" class="label">自动寻找空闲块</text>
  <text x="907" y="516" text-anchor="middle" class="small">优先 2 连排，再补单节</text>

  <rect x="485" y="590" width="230" height="68" class="box write"/>
  <text x="600" y="615" text-anchor="middle" class="label">写入排课结果</text>
  <text x="600" y="636" text-anchor="middle" class="small">course_schedule + status=2</text>

  <rect x="485" y="690" width="230" height="54" class="box write"/>
  <text x="600" y="713" text-anchor="middle" class="label">初始化 Redis 库存</text>
  <text x="600" y="734" text-anchor="middle" class="small">course:stock:{id}=maxCount</text>

  <rect x="165" y="610" width="255" height="58" class="box fail"/>
  <text x="292" y="634" text-anchor="middle" class="label">记录失败原因</text>
  <text x="292" y="655" text-anchor="middle" class="small">继续下一门课程</text>

  <rect x="780" y="610" width="255" height="58" class="box fail"/>
  <text x="907" y="634" text-anchor="middle" class="label">PE 锁定失败</text>
  <text x="907" y="655" text-anchor="middle" class="small">不允许自由调剂</text>

  <path d="M600 159 L600 190" class="line"/>
  <path d="M600 254 L600 285" class="line"/>
  <path d="M600 343 L600 375" class="line"/>
  <path d="M520 433 C420 445,350 455,292 470" class="line"/>
  <text x="430" y="454" class="tag">有偏好</text>
  <path d="M680 433 C780 445,850 455,907 470" class="line"/>
  <text x="760" y="454" class="tag">无偏好或偏好失败</text>
  <path d="M292 542 C350 570,435 585,485 612" class="line"/>
  <text x="375" y="572" class="tag">成功</text>
  <path d="M907 542 C845 570,760 585,715 612" class="line"/>
  <text x="795" y="572" class="tag">成功</text>
  <path d="M292 542 L292 610" class="line"/>
  <text x="305" y="580" class="tag">失败</text>
  <path d="M907 542 L907 610" class="line"/>
  <text x="920" y="580" class="tag">锁冲突</text>
  <path d="M600 658 L600 690" class="line"/>
</svg>
