<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Microsoft YaHei, SimHei, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">SEU 智能选课系统 — 系统上下文图（Use Case Context）</text>

  <!-- ====== 外部参与者区域 ====== -->
  <rect x="20" y="60" width="180" height="620" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="110" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#666">外部参与者</text>

  <!-- 学生 -->
  <rect x="40" y="110" width="140" height="120" rx="8" fill="#ecf5ff" stroke="#409EFF" stroke-width="1.5"/>
  <text x="110" y="140" font-size="15" font-weight="bold" text-anchor="middle" fill="#409EFF">学生</text>
  <text x="110" y="158" font-size="10" text-anchor="middle" fill="#666">Student</text>
  <line x1="60" y1="168" x2="160" y2="168" stroke="#ddd" stroke-width="0.5"/>
  <text x="110" y="185" font-size="9" text-anchor="middle" fill="#555">▸ 选课/退课</text>
  <text x="110" y="200" font-size="9" text-anchor="middle" fill="#555">▸ 查看课表</text>
  <text x="110" y="215" font-size="9" text-anchor="middle" fill="#555">▸ 浏览/查询课程</text>

  <!-- 教师 -->
  <rect x="40" y="255" width="140" height="100" rx="8" fill="#fdf6ec" stroke="#E6A23C" stroke-width="1.5"/>
  <text x="110" y="285" font-size="15" font-weight="bold" text-anchor="middle" fill="#E6A23C">教师</text>
  <text x="110" y="303" font-size="10" text-anchor="middle" fill="#666">Teacher</text>
  <line x1="60" y1="312" x2="160" y2="312" stroke="#ddd" stroke-width="0.5"/>
  <text x="110" y="328" font-size="9" text-anchor="middle" fill="#555">▸ 申报课程</text>
  <text x="110" y="343" font-size="9" text-anchor="middle" fill="#555">▸ 查看申报记录</text>

  <!-- 管理员 -->
  <rect x="40" y="380" width="140" height="130" rx="8" fill="#fef0f0" stroke="#F56C6C" stroke-width="1.5"/>
  <text x="110" y="410" font-size="15" font-weight="bold" text-anchor="middle" fill="#F56C6C">教务管理员</text>
  <text x="110" y="428" font-size="10" text-anchor="middle" fill="#666">Admin</text>
  <line x1="60" y1="437" x2="160" y2="437" stroke="#ddd" stroke-width="0.5"/>
  <text x="110" y="453" font-size="9" text-anchor="middle" fill="#555">▸ 审核课程</text>
  <text x="110" y="468" font-size="9" text-anchor="middle" fill="#555">▸ 智能排课</text>
  <text x="110" y="483" font-size="9" text-anchor="middle" fill="#555">▸ 重置/教室管理</text>

  <!-- 共享功能 -->
  <rect x="40" y="535" width="140" height="75" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="110" y="560" font-size="12" font-weight="bold" text-anchor="middle" fill="#666">共用功能</text>
  <text x="110" y="578" font-size="9" text-anchor="middle" fill="#555">▸ 登录/退出</text>
  <text x="110" y="593" font-size="9" text-anchor="middle" fill="#555">▸ 个人信息管理</text>

  <!-- ====== 系统核心区域 ====== -->
  <rect x="240" y="60" width="740" height="620" rx="10" fill="#f0f7ff" stroke="#409EFF" stroke-width="2"/>
  <text x="610" y="88" font-size="14" font-weight="bold" text-anchor="middle" fill="#409EFF">SEU 智能选课系统（System Boundary）</text>

  <!-- 前端层 -->
  <rect x="270" y="110" width="680" height="180" rx="8" fill="white" stroke="#67C23A" stroke-width="1.5"/>
  <text x="285" y="132" font-size="12" font-weight="bold" fill="#67C23A">表现层（Presentation）— Vue 3 + Element Plus SPA</text>

  <rect x="290" y="145" width="150" height="65" rx="6" fill="#f0f9eb" stroke="#b3e19d" stroke-width="1"/>
  <text x="365" y="167" font-size="10" font-weight="bold" text-anchor="middle" fill="#67C23A">登录界面</text>
  <text x="365" y="183" font-size="8" text-anchor="middle" fill="#888">角色选择 + 表单</text>
  <text x="365" y="196" font-size="8" text-anchor="middle" fill="#888">localStorage持久化</text>

  <rect x="460" y="145" width="150" height="65" rx="6" fill="#f0f9eb" stroke="#b3e19d" stroke-width="1"/>
  <text x="535" y="167" font-size="10" font-weight="bold" text-anchor="middle" fill="#67C23A">学生选课中心</text>
  <text x="535" y="183" font-size="8" text-anchor="middle" fill="#888">分类浏览/选课/退课</text>
  <text x="535" y="196" font-size="8" text-anchor="middle" fill="#888">课表/全校查询</text>

  <rect x="630" y="145" width="150" height="65" rx="6" fill="#f0f9eb" stroke="#b3e19d" stroke-width="1"/>
  <text x="705" y="167" font-size="10" font-weight="bold" text-anchor="middle" fill="#67C23A">教师申报管理</text>
  <text x="705" y="183" font-size="8" text-anchor="middle" fill="#888">课程申报表单</text>
  <text x="705" y="196" font-size="8" text-anchor="middle" fill="#888">申报记录查看</text>

  <rect x="800" y="145" width="135" height="65" rx="6" fill="#f0f9eb" stroke="#b3e19d" stroke-width="1"/>
  <text x="867" y="167" font-size="10" font-weight="bold" text-anchor="middle" fill="#67C23A">教务控制台</text>
  <text x="867" y="183" font-size="8" text-anchor="middle" fill="#888">审核/排课/重置</text>
  <text x="867" y="196" font-size="8" text-anchor="middle" fill="#888">教室资源管理</text>

  <!-- 通信层 -->
  <rect x="290" y="225" width="640" height="45" rx="6" fill="#fff8e1" stroke="#FFB74D" stroke-width="1"/>
  <text x="610" y="245" font-size="10" text-anchor="middle" fill="#E65100">HTTP 通信层：axios (with sa-token header)  ←→  Spring Boot REST API (@CrossOrigin + SaTokenConfigure)</text>
  <text x="610" y="260" font-size="9" text-anchor="middle" fill="#BF360C">认证方式：Sa-Token 会话 (StpUtil.login) | 前端 localStorage 存储 token | 请求自动注入 satoken header</text>

  <!-- 后端层 -->
  <rect x="270" y="290" width="680" height="230" rx="8" fill="white" stroke="#409EFF" stroke-width="1.5"/>
  <text x="285" y="312" font-size="12" font-weight="bold" fill="#409EFF">业务逻辑层 &amp; 数据访问层（Business + Data）— Spring Boot</text>

  <!-- Controller -->
  <rect x="290" y="325" width="150" height="85" rx="6" fill="#ecf5ff" stroke="#79bbff" stroke-width="1"/>
  <text x="365" y="345" font-size="10" font-weight="bold" text-anchor="middle" fill="#409EFF">Controller 层</text>
  <text x="365" y="362" font-size="8" text-anchor="middle" fill="#555">LoginController</text>
  <text x="365" y="376" font-size="8" text-anchor="middle" fill="#555">CourseController</text>
  <text x="365" y="390" font-size="8" text-anchor="middle" fill="#555">ClassroomController</text>
  <text x="365" y="404" font-size="8" text-anchor="middle" fill="#555">UserController</text>

  <!-- Service -->
  <rect x="460" y="325" width="150" height="85" rx="6" fill="#ecf5ff" stroke="#79bbff" stroke-width="1"/>
  <text x="535" y="345" font-size="10" font-weight="bold" text-anchor="middle" fill="#409EFF">Service 层</text>
  <text x="535" y="362" font-size="8" text-anchor="middle" fill="#555">CourseServiceImpl</text>
  <text x="535" y="376" font-size="8" text-anchor="middle" fill="#555">▸ selectCourse (锁+冲突)</text>
  <text x="535" y="390" font-size="8" text-anchor="middle" fill="#555">▸ dropCourse</text>
  <text x="535" y="404" font-size="8" text-anchor="middle" fill="#555">AutoScheduleService</text>

  <!-- Event -->
  <rect x="630" y="325" width="150" height="85" rx="6" fill="#f5f0ff" stroke="#b39ddb" stroke-width="1"/>
  <text x="705" y="345" font-size="10" font-weight="bold" text-anchor="middle" fill="#7B1FA2">Event 事件层</text>
  <text x="705" y="362" font-size="8" text-anchor="middle" fill="#555">CourseEventPublisher</text>
  <text x="705" y="376" font-size="8" text-anchor="middle" fill="#555">6种域事件</text>
  <text x="705" y="390" font-size="8" text-anchor="middle" fill="#555">@Async 异步监听</text>
  <text x="705" y="404" font-size="8" text-anchor="middle" fill="#555">审计日志追踪</text>

  <!-- Mapper + Common -->
  <rect x="800" y="325" width="135" height="85" rx="6" fill="#ecf5ff" stroke="#79bbff" stroke-width="1"/>
  <text x="867" y="345" font-size="10" font-weight="bold" text-anchor="middle" fill="#409EFF">Mapper + Common</text>
  <text x="867" y="362" font-size="8" text-anchor="middle" fill="#555">MyBatis-Plus</text>
  <text x="867" y="376" font-size="8" text-anchor="middle" fill="#555">Result 统一响应</text>
  <text x="867" y="390" font-size="8" text-anchor="middle" fill="#555">GlobalException</text>
  <text x="867" y="404" font-size="8" text-anchor="middle" fill="#555">SaToken / CORS 配置</text>

  <!-- Entity -->
  <rect x="290" y="425" width="640" height="35" rx="6" fill="#f9f9f9" stroke="#ddd" stroke-width="1"/>
  <text x="610" y="448" font-size="9" text-anchor="middle" fill="#666">Entity 实体层：Course | Classroom | CourseSchedule | StudentCourse | UserStudent | UserTeacher | UserAdmin | LoginDTO</text>

  <!-- 基础设施层 -->
  <rect x="270" y="480" width="680" height="70" rx="8" fill="#fff5f5" stroke="#F56C6C" stroke-width="1"/>
  <text x="285" y="502" font-size="12" font-weight="bold" fill="#F56C6C">基础设施层（Infrastructure）</text>

  <rect x="290" y="510" width="200" height="32" rx="5" fill="#ffebee" stroke="#ef9a9a" stroke-width="1"/>
  <text x="390" y="528" font-size="9" text-anchor="middle" fill="#C62828">MySQL (course_db) — 持久化存储</text>

  <rect x="520" y="510" width="200" height="32" rx="5" fill="#ffebee" stroke="#ef9a9a" stroke-width="1"/>
  <text x="620" y="528" font-size="9" text-anchor="middle" fill="#C62828">Redis — 库存计数器 / 缓存 / Set</text>

  <!-- ====== 连接线 ====== -->
  <!-- 参与者 → 前端 -->
  <line x1="180" y1="155" x2="290" y2="175" stroke="#409EFF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="300" x2="290" y2="200" stroke="#E6A23C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="430" x2="290" y2="245" stroke="#F56C6C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 前端 → 通信层 → 后端 -->
  <line x1="610" y1="270" x2="610" y2="290" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 后端 → 基础设施 -->
  <line x1="460" y1="480" x2="390" y2="510" stroke="#F56C6C" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="535" y1="480" x2="560" y2="510" stroke="#F56C6C" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ====== 底部说明 ====== -->
  <rect x="270" y="565" width="680" height="95" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="290" y="585" font-size="10" font-weight="bold" fill="#555">关键架构特征：</text>
  <text x="290" y="602" font-size="9" fill="#666">1. 前后端分离：Vue 3 SPA (port 5173) —HTTP→ Spring Boot (port 8080) —SQL→ MySQL (port 3306)</text>
  <text x="290" y="618" font-size="9" fill="#666">2. 单页应用：所有页面逻辑集中在 App.vue，无 vue-router/Pinia，通过 activeMenu ref 切换视图</text>
  <text x="290" y="634" font-size="9" fill="#666">3. 身份认证：Sa-Token 会话机制 + axios 请求拦截器自动注入 satoken header + 401 响应拦截</text>
  <text x="290" y="650" font-size="9" fill="#666">4. 事件驱动：Spring ApplicationEvent（后端异步审计）+ mitt eventBus（前端组件间数据同步）</text>
</svg>
